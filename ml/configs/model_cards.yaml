# Human-readable model cards, in Russian, for the API (GET /models) and the UI.
# Copied into each new artifact version as card.json by `make train`, and from there into
# model_registry.card by `make predict` / `make registry` (a version trained before this file existed gets
# the text from here). Keep in line with docs/model_card.md (§1 intended use, §5 results, §7 limitations).
#
#   title             shown as the model's name
#   intended_use      one paragraph
#   limitations       list of short paragraphs, most important first
#   metric_names      metric key in the registry metrics -> label
#   baseline_names    baseline / method name in the registry metrics -> label
#   series_level_names (load_forecast) series level in the registry metrics -> label

wait_time:
  title: "A · Время ожидания госпитализации (дни)"
  intended_use: >-
    Прогноз числа дней от направления до госпитализации для каждого направления тестового периода. Используется
    для объяснения нагрузки стационара и сравнения стационаров, а не для решений по отдельному пациенту.
  limitations:
    - >-
      Два месяца обучения и один месяц проверки: сезонность и изменения год к году не учтены, метрики могут
      измениться при появлении новых данных.
    - >-
      Ошибка выше всего в офтальмологии, кардиологии и неврологии, где ожидание долгое; в 4 из 20 регионов
      (Актюбинская, Карагандинская, Кызылординская, Северо-Казахстанская области) модель по MAE не лучше медианы
      по стационару и профилю.
    - >-
      Прогноз отражает связи в исторических данных: «стационар X → +30 дней» не означает, что перенаправление
      пациента сократит ожидание на столько же.
  metric_names:
    mae: "MAE, дней"
    median_ae: "Медианная абсолютная ошибка, дней"
    wape: "WAPE"
    within_7d: "Ошибка не более 7 дней"
    spearman: "Корреляция Спирмена"
  baseline_names:
    LightGBM: "Модель (LightGBM)"
    "B1 global median": "Медиана по стране"
    "B2 median profile × patient region": "Медиана по профилю и региону пациента"
    "B3 median hospital × profile (fallback B2)": "Медиана по стационару и профилю"

refusal_risk:
  title: "B · Риск отказа в госпитализации (вероятность)"
  intended_use: >-
    Вероятность того, что направление закончится отказом, для каждого направления тестового периода. Используется
    для оценки доли направлений с высоким риском (≥ 25%) в стационаре и регионе.
  limitations:
    - >-
      Калибровка хорошая (расхождение прогноза и факта по децилям не более 1 п.п.), но ранжирование слабее в
      Мангистауской, Акмолинской и Актюбинской областях (ROC-AUC 0,71–0,72).
    - >-
      Модель использует регион и тип местности пациента: различия прогнозов между регионами отражают исторический
      доступ к помощи и не должны использоваться для понижения приоритета пациентов из какого-либо региона.
    - >-
      Метки обучающего периода известны задним числом; в реальной эксплуатации часть направлений на дату
      переобучения ещё не завершена, поэтому оценка точности несколько оптимистична.
  metric_names:
    roc_auc: "ROC-AUC"
    pr_auc: "PR-AUC"
    brier: "Brier"
    precision_top: "Точность в топ-10%"
    recall_top: "Полнота в топ-10%"
  baseline_names:
    LightGBM: "Модель (LightGBM)"
    "B1 global rate": "Доля отказов по стране"
    "B2 rate profile × patient region": "Доля отказов по профилю и региону пациента"
    "B3 rate hospital × profile (fallback B2)": "Доля отказов по стационару и профилю"

load_forecast:
  title: "C · Прогноз направлений и госпитализаций на 14 дней"
  intended_use: >-
    Дневной прогноз числа направлений и госпитализаций на 14 дней вперёд для каждого стационара и региона по
    профилю. Используется для планирования нагрузки; прогноз очереди из него не строится.
  limitations:
    - >-
      Ошибки на уровне отдельного стационара высоки у любого метода, потому что дневные числа малы; для малых рядов
      прогноз стационара — доля прогноза региона.
    - >-
      Главный источник ошибок — праздники (неделя Наурыза): в обучении лишь несколько праздничных дней, календарь
      праздников ведётся вручную и должен включать переносы выходных.
    - >-
      Прогнозы стационаров не согласованы с прогнозами регионов. Производный прогноз очереди не показывается: в
      бэктесте он хуже, чем последнее известное значение очереди.
  metric_names:
    wape: "WAPE"
    mae: "MAE"
  baseline_names:
    "LightGBM (Poisson)": "Модель (LightGBM, Пуассон)"
    "seasonal naive (same weekday)": "Сезонная наивная (тот же день недели)"
    "mean 28d": "Среднее за 28 дней"
    "mean 7d": "Среднее за 7 дней"
  series_level_names:
    "hospital × profile (fallback)": "стационар × профиль (малые ряды, доля региона)"
    "hospital × profile (modelled)": "стационар × профиль (модель)"
    "region × profile": "регион × профиль"
  target_names:
    registrations: "направления"
    hospitalizations: "госпитализации"
