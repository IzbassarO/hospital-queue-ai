# Parameters of ml/pipelines/train.py and predict.py. Semantics: docs/model_card.md.

# Temporal split (registration date for referral models; calendar date for the load model).
split:
  train_start: 2025-01-01
  train_end: 2025-02-28
  test_start: 2025-03-01
  test_end: 2025-03-31

# Models A and B: the number of boosting rounds is chosen by early stopping on the last
# `holdout_days` of the TRAIN period (temporal), then the model is refit on the full train period.
early_stopping:
  holdout_days: 14
  max_rounds: 3000
  patience: 100

# Sensible defaults, not tuned.
lightgbm:
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  cat_smooth: 10
  cat_l2: 10
  min_data_per_group: 50
  max_cat_threshold: 64
  seed: 42
  bagging_seed: 42
  feature_fraction_seed: 42
  data_random_seed: 42
  deterministic: true
  verbose: -1

wait_time:
  within_days: 7
  top_profiles: 10

refusal_risk:
  top_fraction: 0.10
  calibration_bins: 10

load_forecast:
  horizon: 14
  lags: [1, 2, 3, 7, 14]
  rolling: [7, 14, 28]
  # first forecast day of each backtest; the model sees data up to the day before
  backtest_origins: [2025-03-03, 2025-03-10, 2025-03-17]
  # last known day for the production forecast written to Postgres
  forecast_origin: 2025-03-31
  min_series_mean: 1.0
  objective: poisson
  rounds: 400
  top_hospitals: 20
  holidays:
    - 2025-01-01
    - 2025-01-02
    - 2025-01-07
    - 2025-03-08
    - 2025-03-10  # transferred day off (8 March fell on Saturday)
    - 2025-03-21
    - 2025-03-22
    - 2025-03-23
    - 2025-03-24
    - 2025-03-25

explain:
  top_k: 5
  shap_sample: 20000
