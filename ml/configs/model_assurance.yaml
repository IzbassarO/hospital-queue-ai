schema_version: model_assurance_v1
contract_version: "1.0.0"
assurance_id: model-assurance-6b5-v1
source_code_commit: 1dcda96b8d8bf760e481c61357b98d98c914b9ed
ml_freeze_status: ML_CORE_CLOSED_FROZEN
product_contract_version: model-assurance-product-v1

freshness_policy:
  allowed_states: [FRESH, STALE, DEGRADED, UNKNOWN]
  sla_thresholds: null
  sla_unresolved_reason: Customer refresh SLA and production source-of-truth cadence are unresolved.
  semantics:
    FRESH: Published evidence is within an explicitly approved future refresh threshold.
    STALE: Published evidence is older than an explicitly approved future refresh threshold.
    DEGRADED: Evidence is present but lineage, support, publication, or upstream availability is impaired.
    UNKNOWN: Freshness cannot be determined because runtime timestamps or approved thresholds are unavailable.

claim_boundaries:
  pressure_basis: historical_flow_proxy_v1
  pressure_basis_semantics: Origin-legal historical count threshold; not physical capacity.
  decision_alternative_semantics: retrospective mathematical alternatives for human review
  forbidden_project_descriptions_and_claims:
    - AI recommender
    - patient router
    - autonomous routing system
    - capacity optimizer
    - capacity planner
    - Digital Twin
    - causal simulator
    - intervention engine
    - free beds
    - occupancy
    - staffed capacity
    - physical feasibility
    - causal benefit
    - clinical benefit
    - reduced waiting time
    - improved outcomes
  enforcement: Future product copy and DTO adapters must preserve these boundaries unless new accepted evidence explicitly changes them.

failed_evidence_history:
  - run_id: decision-alternatives-6b4-real-v1
    classification: FAILED_EVIDENCE
    scientific_rejection: false
    reason: Real parquet reason_codes materialized array-like, making boolean truthiness ambiguous.
    source: docs/project-evidence-index.md#14-constrained-decision-alternatives-engine-v1
  - run_id: decision-alternatives-6b4-real-v2
    classification: FAILED_EVIDENCE
    scientific_rejection: false
    reason: Raw float.hex() containing '+' was embedded in ScenarioSpec.scenario_id and violated the identifier contract.
    source: docs/project-evidence-index.md#14-constrained-decision-alternatives-engine-v1

monitoring_expectations:
  - id: data_freshness
    implementation_status: FUTURE_EXPECTATION
    expectation: Track source and publication timestamps once an approved refresh SLA exists; report UNKNOWN until then.
  - id: schema_drift
    implementation_status: FUTURE_EXPECTATION
    expectation: Reject or degrade incompatible source and bundle schemas.
  - id: stable_id_drift
    implementation_status: FUTURE_EXPECTATION
    expectation: Detect changed or missing hospital, region, profile, referral, estimand, and capability identifiers.
  - id: lineage_hash_mismatch
    implementation_status: FUTURE_EXPECTATION
    expectation: Verify source run, data, config, code, artifact, and assurance identities during publication.
  - id: artifact_publication_failure
    implementation_status: FUTURE_EXPECTATION
    expectation: Fail closed and retain the prior active snapshot when publication is incomplete.
  - id: support_mix
    implementation_status: FUTURE_EXPECTATION
    expectation: Track DIRECT_SUPPORTED, FALLBACK_LIMITED, UNSUPPORTED, COMPLETE, and RANGE_LIMITED separately.
  - id: fallback_and_unsupported_growth
    implementation_status: FUTURE_EXPECTATION
    expectation: Surface growth in fallback and unsupported shares without converting it to a confidence score.
  - id: predictive_and_calibration_evidence
    implementation_status: FUTURE_EXPECTATION
    expectation: Track accepted predictive metrics, calibration error, and interval coverage only where applicable.
  - id: pressure_provider_availability
    implementation_status: FUTURE_EXPECTATION
    expectation: Track historical_flow_proxy_v1 availability and never silently substitute physical capacity semantics.
  - id: scenario_verification
    implementation_status: FUTURE_EXPECTATION
    expectation: Track boundary, invariance, conservation, monotonicity, hierarchy, and determinism failures.
  - id: decision_alternative_verification
    implementation_status: FUTURE_EXPECTATION
    expectation: Track receiver worsening, full-verification failure, abstention, support tier, and range completeness.
  - id: runtime_and_resources
    implementation_status: FUTURE_EXPECTATION
    expectation: Track publication/runtime/resource regressions against reviewed operating expectations, not invented customer SLAs.
  - id: human_review_audit
    implementation_status: FUTURE_EXPECTATION
    expectation: Retain publication, reviewer, activation, supersession, and human-decision audit trails.

