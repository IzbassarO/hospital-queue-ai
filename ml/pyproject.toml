[project]
name = "hqai-ml"
version = "0.1.0"
description = "hospital-queue-ai data & ML pipelines"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.5",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "rapidfuzz==3.14.6",
    "pyyaml==6.0.3",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.5",
    "lightgbm==4.7.0",  # macOS: needs `brew install libomp`
    "scikit-learn==1.9.1",
    "shap==0.52.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hqai_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
