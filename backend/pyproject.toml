[project]
name = "hqai-backend"
version = "0.1.0"
description = "hospital-queue-ai API (FastAPI) and database schema"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.5",
    "openpyxl==3.1.5",   # XLSX export of the hospital card
    "reportlab==5.0.1",  # PDF export of the hospital card
]

[project.optional-dependencies]
# API tests against the running Postgres (make test); not installed in the backend image
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"  # no .pytest_cache outside scratch/ (project rule)
