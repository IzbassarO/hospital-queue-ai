[project]
name = "hqai-backend"
version = "0.1.0"
description = "hospital-queue-ai API (FastAPI) and database schema"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
