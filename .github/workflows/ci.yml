# Backend lint + API tests and frontend lint + tests + build, on every push and pull request.
# The tests need a database with serving marts: CI loads the 2-region fixture (backend/tests/fixtures, built by
# `make fixture`) into a fresh upstream Postgres 16 service (no extensions) and builds the marts from it — the full
# open data never leaves the developer machine. A third job rehearses `make demo` without Docker: the committed seed/
# is loaded into a fresh database with the backend's own loader and the published identities are checked through the
# API. A fourth job builds the three docker images (no push) so a broken Dockerfile or lockfile is caught before
# someone runs `make demo`, and checks that the production override still composes (docs/operations.md). A fifth
# job lints and tests the shared-server deploy tooling against stubs: no daemon, no credentials, nothing deployed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          # throwaway CI database, not a secret
          POSTGRES_USER: hqai
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hqai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hqai -d hqai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PY: python
      POSTGRES_USER: hqai
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hqai
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies for the repository audit
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Font with Cyrillic glyphs for the PDF export
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Apply db/init.sql (as the postgres container does on a fresh volume)
        run: psql -h localhost -U hqai -d hqai -v ON_ERROR_STOP=1 -f db/init.sql

      - name: Migrate and load the test fixture
        run: make fixture-load

      - name: Build serving marts
        run: make marts

      - name: Repository audit (architecture, OpenAPI contract, backend and frontend)
        run: make audit

  demo-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          # throwaway CI database, not a secret
          POSTGRES_USER: hqai
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hqai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hqai -d hqai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_USER: hqai
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hqai
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      PGPASSWORD: postgres
      HQAI_SEED_SMOKE: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the backend as the image does, plus its test extras
        run: python -m pip install ".[test]"

      - name: Apply db/init.sql (as the postgres container does on a fresh volume)
        run: psql -h localhost -U hqai -d hqai -v ON_ERROR_STOP=1 -f ../db/init.sql

      - name: Migrate
        run: alembic upgrade head

      - name: Load the demo seed (tables, then the publication bundles listed in seed/manifest.json)
        run: python -m app.cli load-seed --dir ../seed

      - name: Seed smoke test (row counts, identities, key endpoints)
        run: python -m pytest tests/test_seed_smoke.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests (Vitest; also checks the client against docs/api.md examples)
        run: npm test

  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the backend image (docker compose service `backend`)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build the frontend image (docker compose service `frontend`; nginx + the production bundle)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build the ML pipelines image (compose profile `pipelines`; closed-network nightly refresh)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ml/Dockerfile
          push: false
          cache-from: type=gha,scope=ml
          cache-to: type=gha,scope=ml,mode=max

      # config only, nothing is started: keeps docker-compose.prod.yml from drifting away from docker-compose.yml
      - name: The production override still composes
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --profile demo --profile pipelines config > /dev/null
          rm -f .env

  # tools/deploy.sh (docs/deploy-shared-server.md): shellcheck, a scan for destructive commands, and the update /
  # rollback / check paths against stub docker, make and curl in a throwaway git checkout. Nothing is deployed and no
  # secret is used; the .env values it writes are random markers the test asserts never reach the output.
  deploy-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy tooling (shellcheck + stubbed tests)
        run: |
          shellcheck --version | head -n2
          bash tools/deploy_test.sh
