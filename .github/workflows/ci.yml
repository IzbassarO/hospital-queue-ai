# Backend lint + API tests and frontend lint + tests + build, on every push and pull request.
# The tests need a database with serving marts: CI loads the 2-region fixture (backend/tests/fixtures, built by
# `make fixture`) into a fresh Postgres 16 + pgvector service and builds the marts from it — the full open data never
# leaves the developer machine.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # throwaway CI database, not a secret
          POSTGRES_USER: hqai
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hqai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hqai -d hqai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PY: python
      POSTGRES_USER: hqai
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hqai
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Font with Cyrillic glyphs for the PDF export
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Lint (ruff)
        run: make lint

      - name: Database extensions (as docker compose does)
        run: psql -h localhost -U hqai -d hqai -v ON_ERROR_STOP=1 -f db/init.sql

      - name: Migrate and load the test fixture
        run: make fixture-load

      - name: Build serving marts
        run: make marts

      - name: Alembic drift check
        run: cd backend && python -m alembic check

      - name: API tests
        run: make test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Tests (Vitest; also checks the client against docs/api.md examples)
        run: npm test

      - name: Production build (tsc + Vite)
        run: npm run build
