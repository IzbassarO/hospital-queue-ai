services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hqai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    image: hqai-backend:latest
    container_name: hqai-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # inside the compose network postgres is reached by service name on its container port
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    image: hqai-frontend:latest
    container_name: hqai-frontend
    restart: unless-stopped
    # nginx serves the built UI and proxies /api to backend:8000, adding the demo API key server-side:
    # it stays in the container environment and never reaches the browser (docs/security.md)
    environment:
      DEMO_API_KEY: ${DEMO_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
